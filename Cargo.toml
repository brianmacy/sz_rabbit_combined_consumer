[package]
name = "sz_rabbit_combined_consumer"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Brian Macy"]
description = "Combined RabbitMQ load + redo Senzing driver (one redo% knob; subsumes sz_rabbit_consumer and sz_simple_redoer)"
license = "Apache-2.0"

[[bin]]
name = "sz_rabbit_combined_consumer"
path = "src/main.rs"

[lib]
name = "sz_rabbit_combined_consumer"
path = "src/lib.rs"

[dependencies]
sz-rust-sdk = { git = "https://github.com/brianmacy/sz-rust-sdk", rev = "b595ca4" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
lapin = "4"
futures-lite = "2"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
num_cpus = "1"
# Signal handling (block-before-init + dedicated sigwait thread) and `_exit(2)`
# for the shutdown path: terminate WITHOUT running libc atexit(3) handlers / C++
# static destructors, which is where the native Senzing engine teardown wedges on
# SIGTERM (issue #4). Replaces the previous `ctrlc` handler, which never fired
# because libSz's `Sz_init` interferes with per-handler signal delivery.
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
