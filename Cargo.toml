[workspace]
# resolver "3" is MSRV-aware: it selects dependency versions compatible with the
# workspace rust-version (1.88), so the fast-moving AWS SDK (whose newest releases
# require rustc 1.94+) resolves to the latest 1.88-compatible versions instead of
# failing the build.
resolver = "3"
members = ["crates/core", "crates/rabbit", "crates/sqs"]

[workspace.package]
version = "0.2.0"
edition = "2024"
# Bumped 1.88 -> 1.94.1 so the MSRV-aware resolver selects the current AWS SDK
# (aws-smithy-http-client >= 1.2 uses rustls 0.23 / rustls-webpki 0.103.13+),
# clearing RUSTSEC-2026-0098/-0099/-0104 without deny.toml ignores.
rust-version = "1.94.1"
authors = ["Brian Macy"]
license = "Apache-2.0"

[workspace.dependencies]
sz-rust-sdk = { git = "https://github.com/brianmacy/sz-rust-sdk", rev = "b595ca4" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
lapin = "4"
futures-lite = "2"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }
num_cpus = "1"
libc = "0.2"
# SQS backend (crates/sqs only). aws-sdk-sqs is Apache-2.0.
# default-features = false drops the SDK's legacy `rustls` feature (hyper-0.14 +
# rustls 0.21 -> vulnerable rustls-webpki 0.101.7). We keep only the MODERN
# HTTPS client (`default-https-client` = rustls-aws-lc, rustls 0.23 /
# rustls-webpki 0.103.13). This also drops aws-config's `sso` + `credentials-
# process` providers (they transitively re-pull the legacy stack); the standard
# provider chain (env vars, ~/.aws profile, IMDS/ECS role, web-identity) is
# unaffected. Re-add those features if SSO / credential_process auth is needed.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }

# sz-combined-consumer-core: the broker-agnostic engine-processing library shared
# by every backend binary (RabbitMQ, SQS, ...).
sz-combined-consumer-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
