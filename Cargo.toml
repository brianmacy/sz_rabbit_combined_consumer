[workspace]
resolver = "2"
members = ["crates/core", "crates/rabbit"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Brian Macy"]
license = "Apache-2.0"

[workspace.dependencies]
sz-rust-sdk = { git = "https://github.com/brianmacy/sz-rust-sdk", rev = "b595ca4" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
lapin = "4"
futures-lite = "2"
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ctrlc = { version = "3", features = ["termination"] }
num_cpus = "1"
libc = "0.2"

# sz-combined-consumer-core: the broker-agnostic engine-processing library shared
# by every backend binary (RabbitMQ, SQS, ...).
sz-combined-consumer-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
