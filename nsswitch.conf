# Files-only NSS for this distroless service container.
#
# The distroless/cc-debian13 base ships the Debian default nsswitch
# (passwd/group: compat, netgroup: nis). Under the msodbc18 / krb5 / GSSAPI
# per-connection lookup path at high worker concurrency, the compat+nis backends
# route getpwnam/getgrnam/netgroup through NIS/SunRPC (clntudp/authdes) and
# serialize every worker thread on the glibc NSS global rwlock — a dominant,
# silent throughput bottleneck (CPU ~half-idle, negative scaling with threads).
#
# This container connects to the datastore and AMQP by IP with SQL auth; it never
# performs interactive login and needs neither NIS nor LDAP. Files-only removes
# the network name lookups and the NSS-lock convoy entirely.
passwd:         files
group:          files
shadow:         files
gshadow:        files
hosts:          files dns
networks:       files
protocols:      files
services:       files
ethers:         files
rpc:            files
netgroup:       files
